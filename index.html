<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    background: #ffffff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    width: min(96vmin, 720px);
  }
  .wrap img {
    width: 100%;
    height: auto;
    display:block;
  }
</style>
</head>
<body>
<div class="wrap">
  <img src="photo.png" alt="" />
</div>
</body>
</html>
